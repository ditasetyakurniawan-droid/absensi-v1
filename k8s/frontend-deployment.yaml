apiVersion: apps/v1
kind: Deployment
metadata:
  name: absensi-frontend
  namespace: test-app
  labels:
    app: absensi-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: absensi-frontend
  template:
    metadata:
      labels:
        app: absensi-frontend
    spec:
      containers:
      - name: frontend
        image: 192.168.100.58/devops-apps/frontend:latest # Nanti di-update oleh Jenkins / GitOps
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: absensi-frontend-service
  namespace: test-app
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: absensi-frontend